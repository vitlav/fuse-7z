name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 7-Zip
          - os: ubuntu-24.04
            sevenzip: 7zip
          # p7zip 16.02
          - os: ubuntu-22.04
            sevenzip: p7zip-full
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libfuse3-dev fuse3 ${{ matrix.sevenzip }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: DESTDIR=$PWD/destdir cmake --install build && ls -lR destdir
